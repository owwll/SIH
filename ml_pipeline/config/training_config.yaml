# NaviCore AI: 1D-TCN Training Configuration
experiment:
  name: "navicore_tcn_iovnbd"
  seed: 42
  dataset_version: "iovnbd_v1.0_coventry"
  output_dir: "models/checkpoints"

data:
  raw_data_dir: "../data/raw_iovnbd"
  training_rate_hz: 10          # Native IO-VNBD sampling rate (Hz)
  device_sampling_rate_hz: 100  # On-device Android IMU sampling rate (Hz)
  window_len_samples: 10        # 1.0 second window at 10 Hz (10 samples)
  stride_samples: 1             # 0.1 second stride (10 Hz output)
  train_split_ratio: 0.8
  val_split_ratio: 0.1
  test_split_ratio: 0.1

model:
  in_channels: 6                # [ax, ay, az, gx, gy, gz]
  stem_filters: 32
  stem_kernel_size: 7
  residual_blocks:
    - { dilation: 1, filters: 32, kernel_size: 3 }
    - { dilation: 2, filters: 64, kernel_size: 3 }
    - { dilation: 4, filters: 128, kernel_size: 3 }
  se_reduction: 4
  bottleneck_units: 64
  dropout_prob: 0.2

training:
  epochs: 60
  batch_size: 64
  learning_rate: 0.001
  weight_decay: 0.0001
  scheduler: "cosine_annealing"
  loss_weights:
    speed_nll: 1.0
    zupt_bce: 0.5
    zupt_pos_weight: 3.0
    smoothness: 0.1
  early_stopping_patience: 10

quantization:
  method: "ptq_int8"           # Post-Training Quantization INT8
  calibration_samples: 500
  target_delegate: "nnapi"     # Android NNAPI / Hexagon NPU

augmentations:
  enabled: true
  pothole_shock:
    enabled: true
    shock_intensity_g: 3.5      # Peak shock acceleration magnitude in Gs (vertical spike)
    duration_samples: 2         # Duration of shock impulse in samples (at training rate)
    probability: 0.35           # Probability of injection when moving
  engine_idle:
    enabled: true
    idle_freq_hz: 22.0          # Nominal engine idle frequency (Hz)
    min_freq_hz: 15.0           # Lower bound of engine idle vibration band (Hz)
    max_freq_hz: 30.0           # Upper bound of engine idle vibration band (Hz)
    amplitude_mps2: 0.8         # Peak body vibration amplitude in m/s^2
  gaussian_noise:
    enabled: true
    accel_std: 0.05             # Accelerometer white noise standard deviation (m/s^2)
    gyro_std: 0.005             # Gyroscope white noise standard deviation (rad/s)
  orientation_jitter:
    enabled: true
    max_angle_deg: 15.0         # Maximum 3D mount perturbation angle (degrees)

